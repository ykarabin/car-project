# Attach through ST-Link for output-only RTT, preserving the MCU's run/halt state.
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd
source [find target/stm32g4x.cfg]
# Do not assert the board's reset pin when attaching this console.
reset_config none
adapter speed 100
bindto 127.0.0.1
init
rtt setup 0x20000000 0x20000 "SEGGER RTT"
rtt polling_interval 20
rtt start
rtt server start 9090 0
