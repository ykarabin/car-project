# Coverage of the project's own code by the host tests (see docs/dev/README.md).
root = .
filter = firmware/vehicle-ecu/Core/Src/
filter = shared/remote_protocol/
filter = firmware/remote-gateway/components/
filter = firmware/remote-gateway/main/
# CubeMX-generated interrupt handlers are compiled into a test but are not our code.
exclude = firmware/vehicle-ecu/Core/Src/stm32g4xx_.*
exclude-unreachable-branches = yes
print-summary = yes
