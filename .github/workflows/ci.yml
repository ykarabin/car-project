name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7

      - name: Host tests (ECU + Gateway)
        run: |
          cmake -S tests -B build/host-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-tests --parallel
          ctest --test-dir build/host-tests --output-on-failure

      - name: Gateway tests (standalone CMake project)
        run: |
          cmake -S firmware/remote-gateway/tests -B build/gateway-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/gateway-tests --parallel
          ctest --test-dir build/gateway-tests --output-on-failure

      - name: Tests with ASan + UBSan
        run: |
          # Older ASan runtimes fail with the kernel's high-entropy ASLR.
          sudo sysctl -w vm.mmap_rnd_bits=28
          cmake -S tests -B build/sanitize-tests -DCMAKE_BUILD_TYPE=Debug -DHOST_SANITIZE=ON
          cmake --build build/sanitize-tests --parallel
          ctest --test-dir build/sanitize-tests --output-on-failure

      - name: Coverage (GCC + gcovr)
        env:
          CC: gcc
        run: |
          python3 -m venv /tmp/gcovr && /tmp/gcovr/bin/pip install --quiet "gcovr==8.8"
          cmake -S tests -B build/coverage-tests -DCMAKE_BUILD_TYPE=Debug -DHOST_COVERAGE=ON
          cmake --build build/coverage-tests --parallel
          ctest --test-dir build/coverage-tests --output-on-failure
          mkdir -p build/coverage
          /tmp/gcovr/bin/gcovr build/coverage-tests \
            --markdown-summary build/coverage/summary.md \
            --html-details build/coverage/index.html
          cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage/

  lint:
    name: Lint (clang-format, cppcheck MISRA)
    runs-on: ubuntu-24.04
    # ESP-IDF is needed for the Gateway compile_commands.json.
    container: espressif/idf:v6.0.1
    env:
      CPPCHECK_VERSION: 2.22.0
      CLANG_FORMAT_VERSION: 23.1.5
    steps:
      - uses: actions/checkout@v7

      - name: Cache cppcheck
        id: cppcheck-cache
        uses: actions/cache@v6
        with:
          path: /opt/cppcheck
          key: cppcheck-${{ env.CPPCHECK_VERSION }}-idf-v6.0.1

      - name: Build cppcheck
        if: steps.cppcheck-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          apt-get update && apt-get install -y --no-install-recommends g++
          curl -fsSL "https://github.com/danmar/cppcheck/archive/refs/tags/${CPPCHECK_VERSION}.tar.gz" | tar -xz -C /tmp
          cmake -S "/tmp/cppcheck-${CPPCHECK_VERSION}" -B /tmp/cppcheck-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/cppcheck \
            -DFILESDIR=/opt/cppcheck/share/cppcheck
          cmake --build /tmp/cppcheck-build
          cmake --install /tmp/cppcheck-build

      - name: Install clang-format
        shell: bash
        run: |
          python3 -m venv /opt/lint
          /opt/lint/bin/pip install --quiet "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Format
        shell: bash
        run: PATH="/opt/lint/bin:$PATH" python3 tools/lint/check.py format

      - name: Gateway compile_commands.json
        working-directory: firmware/remote-gateway
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3

      - name: cppcheck + MISRA
        shell: bash
        run: PATH="/opt/cppcheck/bin:$PATH" python3 tools/lint/check.py cppcheck --require-gateway

  ecu:
    name: Vehicle ECU (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [Debug, Release]
    env:
      ARM_GCC: arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi
    steps:
      - uses: actions/checkout@v7

      - name: Cache Arm GNU Toolchain
        id: arm-cache
        uses: actions/cache@v6
        with:
          path: ~/arm-gcc
          key: ${{ env.ARM_GCC }}

      - name: Install Arm GNU Toolchain
        if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/arm-gcc
          curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/${ARM_GCC}.tar.xz" \
            | tar -xJ -C ~/arm-gcc --strip-components=1

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build
        working-directory: firmware/vehicle-ecu
        run: |
          export PATH="$HOME/arm-gcc/bin:$PATH"
          arm-none-eabi-gcc --version | head -1
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Check image (calibration region, Flash size)
        run: |
          export PATH="$HOME/arm-gcc/bin:$PATH"
          python3 tools/ci/check_ecu_image.py firmware/vehicle-ecu/build/${{ matrix.preset }}/vehicle-ecu.elf

      - uses: actions/upload-artifact@v7
        with:
          name: vehicle-ecu-${{ matrix.preset }}
          path: |
            firmware/vehicle-ecu/build/${{ matrix.preset }}/vehicle-ecu.elf
            firmware/vehicle-ecu/build/${{ matrix.preset }}/vehicle-ecu.map
          if-no-files-found: warn

  gateway:
    name: Remote Gateway
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        working-directory: firmware/remote-gateway
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py size

      - uses: actions/upload-artifact@v7
        with:
          name: remote-gateway
          path: |
            firmware/remote-gateway/build/remote-gateway.elf
            firmware/remote-gateway/build/remote-gateway.bin
            firmware/remote-gateway/build/bootloader/bootloader.bin
            firmware/remote-gateway/build/partition_table/partition-table.bin
            firmware/remote-gateway/build/flash_args

  display-unit:
    name: Display Unit
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@v7

      - name: Build
        working-directory: firmware/display-unit
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py size

      - uses: actions/upload-artifact@v7
        with:
          name: display-unit
          path: |
            firmware/display-unit/build/display-unit.elf
            firmware/display-unit/build/display-unit.bin
            firmware/display-unit/build/bootloader/bootloader.bin
            firmware/display-unit/build/partition_table/partition-table.bin
            firmware/display-unit/build/flash_args
